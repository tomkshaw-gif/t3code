name: Desktop release (fork)

# Fork pipeline: builds the Windows NSIS installer and publishes it to this
# repo's GitHub Releases — that releases feed is what electron-updater checks,
# because build-desktop-artifact.ts wires publish to GITHUB_REPOSITORY (this
# fork) automatically. Stable-channel installs only read the release marked
# "latest", so every run must ship a plain x.y.z version and keep that flag.

on:
  # Push a v<x.y.z> tag to release: git tag v0.0.42 && git push origin v0.0.42
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version x.y.z — must be newer than the installed build (apps/server/package.json is the base)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 + publish release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Tag pushes carry the version in ref_name (v0.0.41); dispatch takes the input.
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate version
        shell: pwsh
        run: |
          $v = $env:RELEASE_VERSION.Trim().TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be plain x.y.z (no prerelease suffix — nightly/preview builds are not served to stable installs). Got: '$env:RELEASE_VERSION'"
          }
          "RELEASE_VERSION=$v" >> $env:GITHUB_ENV

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false

      - name: Install desktop dependencies
        run: vp install --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Write public build config (.env)
        # .env.example carries the public Clerk/relay identifiers (documented
        # as non-secret); the Vite configs pick them up through loadRepoEnv so
        # the released app keeps T3 Connect. Without this the build succeeds
        # but ships with cloud features disabled.
        shell: pwsh
        run: Copy-Item .env.example .env

      - name: Build NSIS installer
        run: node scripts/build-desktop-artifact.ts --platform win --target nsis --build-version "$env:RELEASE_VERSION"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $files = Get-ChildItem release -File |
            Where-Object { $_.Extension -in '.exe', '.yml', '.blockmap' } |
            ForEach-Object { $_.FullName }
          if (-not $files) { throw "No release artifacts found under release/" }
          gh release create $tag $files `
            --title "T3 Code (Tom) $tag" `
            --latest `
            --notes "Fork desktop build $tag"
